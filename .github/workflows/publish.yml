name: Build & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. patch bump of latest npm release)"
        required: false
        default: ""
      ref:
        description: "Upstream branch/tag to package (e.g. feat/npm-package)"
        required: false
        default: ""
      upstream-repo:
        description: "Upstream clone URL (e.g. https://github.com/yCENzh/Shirone.git)"
        required: false
        default: ""
      package-name:
        description: "npm package name (e.g. shirones)"
        required: false
        default: ""
      dry-run:
        description: "Rehearsal: build & validate, publish nothing"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # required by `npm publish --provenance`
  id-token: write

env:
  SHIRONES_UPSTREAM_REPO: ${{ github.event.inputs.upstream-repo || 'https://github.com/LyraVoid/Shirone.git' }}
  SHIRONES_UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
  SHIRONES_PACKAGE_NAME: ${{ github.event.inputs.package-name || 'shirones' }}
  SHIRONES_PACKAGE_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      # install defaults to true; .npmrc `lockfile=false` makes the built-in
      # `pnpm install` equivalent to `pnpm install --no-lockfile`
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          # Track the latest pnpm: the published package's `packageManager`
          # (and therefore every `init`-scaffolded project) pins exactly this
          # version, which build-package.mjs captures via `pnpm --version`.
          version: latest
          runtime: node@24
          # no cache: — its cache key hashes a lockfile, and the lockfile worth keying on (the theme's) does not exist until the sync step.
          cache: false

      - name: Sync theme source from upstream
        run: pnpm sync
      - name: Resolve version
        id: version
        run: node scripts/resolve-version.mjs
      - name: Prepare user templates
        run: pnpm templates
      - name: Build package
        run: pnpm build
      - name: Generate manifest
        run: pnpm manifest
      - name: Validate package end to end
        run: pnpm validate

      - name: Summary
        run: |
          {
            echo "### $(node -p "require('./dist/package.json').name")@${{ steps.version.outputs.version }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| repo | \`$SHIRONES_UPSTREAM_REPO\` |"
            echo "| ref | \`$SHIRONES_UPSTREAM_REF\` |"
            echo "| commit | \`$(cat workspace/.synced-sha)\` |"
            echo "| routes | $(node -p "require('./dist/manifest.json').counts.routes") |"
            echo "| components | $(node -p "require('./dist/manifest.json').counts.components") |"
            echo "| dist size | $(du -sh dist | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only worth the bytes when nothing is published: a real release is
      # already on npm, a dry-run needs the tarball to inspect.
      - name: Upload build output
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/
          retention-days: 14

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          npm publish ./dist --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
