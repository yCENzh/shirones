name: Build & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. patch bump of latest npm release)"
        required: false
        default: ""
      ref:
        description: "Upstream branch/tag to package (e.g. feat/npm-package)"
        required: false
        default: ""
      upstream-repo:
        description: "Upstream clone URL (e.g. https://github.com/yCENzh/Shirone.git)"
        required: false
        default: ""
      package-name:
        description: "npm package name (e.g. shirones)"
        required: false
        default: ""
      mode:
        description: "Publish directly, validate and publish, or validate only"
        type: choice
        options:
          - publish-only
          - validate-and-publish
          - validate-only
        required: true
        default: publish-only

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHIRONES_UPSTREAM_REPO: ${{ github.event.inputs.upstream-repo || 'https://github.com/LyraVoid/Shirone.git' }}
  SHIRONES_UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
  SHIRONES_PACKAGE_NAME: ${{ github.event.inputs.package-name || 'shirones' }}
  SHIRONES_PACKAGE_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # install defaults to true; with the committed pnpm-lock.yaml the
      # built-in `pnpm install` resolves the pipeline deps in one step.
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          # Track the latest pnpm: build-package.mjs records this exact version
          # as the packageManager for every scaffolded project.
          version: latest
          runtime: node@lts
          install: true
          # Cache the pnpm store, keyed on the committed pnpm-lock.yaml.
          cache: true

      - name: Validate version parser
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:version
      - name: Validate peer range derivation
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:config
      - name: Validate template rewrite rules
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:templates
      - name: Validate collection declarations
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:collections
      - name: Validate generated-upstream compatibility patches
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:upstream-patches
      - name: Resolve version
        id: version
        run: node scripts/resolve-version.mjs
      - name: Sync upstream and prepare user templates
        run: pnpm templates
      - name: Validate icon pipeline contract
        if: ${{ inputs.mode != 'publish-only' }}
        run: pnpm test:icons
      - name: Build package and manifest
        run: pnpm build
      - parallel:
          - name: Validate packed package lifecycle and dev server
            if: ${{ inputs.mode != 'publish-only' }}
            # Keep the full mode: the dev-server smoke test's module-graph
            # crawl catches resolution regressions that a static build misses.
            run: pnpm validate

          - name: Validate config and component overrides
            if: ${{ inputs.mode != 'publish-only' }}
            run: SHIRONES_OVERTEST_SKIP_BUILD=1 pnpm override-test

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### $(node -p "require('./dist/package.json').name")@${{ steps.version.outputs.version }}

          | field | value |
          | --- | --- |
          | mode | \`${{ inputs.mode }}\` |
          | repo | \`$SHIRONES_UPSTREAM_REPO\` |
          | ref | \`$SHIRONES_UPSTREAM_REF\` |
          | commit | \`$(cat workspace/.synced-sha)\` |
          | routes | $(node -p "require('./dist/manifest.json').counts.routes") |
          | components | $(node -p "require('./dist/manifest.json').counts.components") |
          | dist size | $(du -sh dist | cut -f1) |
          EOF

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/
          retention-days: 14

  publish:
    name: Publish to npm
    needs: build
    if: ${{ inputs.mode != 'validate-only' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required only in this job by `npm publish --provenance`.
      id-token: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: dist/

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Publish
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          npm publish ./dist --provenance --access public --loglevel=warn
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
